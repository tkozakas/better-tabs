<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Better Tabs — Export / Import</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      background: #0d1117;
      color: #e6edf3;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }
    .card {
      width: 420px;
    }
    h1 { font-size: 18px; margin-bottom: 4px; }
    .subtitle { color: #8b949e; font-size: 13px; margin-bottom: 24px; }
    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 20px 0 8px;
    }
    .btn {
      width: 100%;
      padding: 10px 16px;
      margin: 5px 0;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }
    .primary { background: #238636; color: white; }
    .primary:hover { background: #2ea043; }
    .secondary { background: #21262d; color: #e6edf3; border: 1px solid #30363d; }
    .secondary:hover { background: #30363d; }
    .drop-zone {
      border: 2px dashed #30363d;
      border-radius: 8px;
      padding: 28px 16px;
      text-align: center;
      color: #8b949e;
      font-size: 13px;
      margin: 8px 0;
    }
    .drop-zone.dragover { border-color: #58a6ff; color: #58a6ff; }
    .status { font-size: 13px; margin-top: 12px; min-height: 18px; }
    .status.ok { color: #3fb950; }
    .status.error { color: #f85149; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Export / Import</h1>
    <div class="subtitle">Back up your protected sites or move them to another browser.</div>

    <div class="section-title">Export</div>
    <button class="btn secondary" id="export-btn">Download sites as JSON</button>

    <div class="section-title">Import</div>
    <div class="drop-zone" id="drop-zone">Drop a JSON file here</div>
    <button class="btn primary" id="pick-btn">Choose file…</button>
    <input type="file" id="import-file" accept=".json,application/json" class="hidden">

    <div class="status" id="status"></div>
  </div>
  <script src="transfer.js"></script>
</body>
</html>
