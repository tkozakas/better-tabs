<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Better Tabs — Back up / restore</title>
  <link rel="stylesheet" href="transfer.css">
</head>
<body>
  <div class="card">
    <h1>Back up / restore</h1>
    <div class="subtitle">Back up your protected sites or move them to another browser.</div>

    <div class="section-title">Export</div>
    <button class="btn secondary" id="export-btn">Download sites as JSON</button>

    <div class="section-title">Import</div>
    <div class="drop-zone" id="drop-zone">Drop a JSON file here</div>
    <button class="btn primary" id="pick-btn">Choose file…</button>
    <input type="file" id="import-file" accept=".json,application/json" class="hidden">

    <div class="status" id="status"></div>
    <div class="access-box hidden" id="access-box">
      <ul id="access-list"></ul>
      <button class="btn primary" id="grant-btn"></button>
    </div>
  </div>
  <script src="transfer.js"></script>
</body>
</html>
