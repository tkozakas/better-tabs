<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
    <h1>Better Tabs</h1>
  </div>

  <div class="section">
    <div class="section-title">Tab Actions</div>
    <div class="btn-row">
      <button class="btn secondary" id="group-btn" title="Group tabs by domain (Alt+Shift+G)">
        <svg viewBox="0 0 24 24"><path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm8-2h8v8h-8v-8zm2 2v4h4v-4h-4z"/></svg>
        Group
      </button>
      <button class="btn secondary" id="ungroup-btn" title="Ungroup All">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10H7v-2h10v2z"/></svg>
        Ungroup
      </button>
    </div>
    <div class="btn-row">
      <button class="btn secondary" id="sort-btn" title="Sort tabs by site, then title (Alt+Shift+S)">
        <svg viewBox="0 0 24 24"><path d="M3 18h6v-2H3v2zM3 6v2h18V6H3zm0 7h12v-2H3v2z"/></svg>
        Sort
      </button>
      <button class="btn secondary" id="close-dupes-btn" title="Close duplicate tabs (Alt+Shift+D)">
        <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
        Dedupe
      </button>
    </div>
    <div id="toast-area"></div>
    <div class="settings-row">
      <label for="ignore-query-check">Ignore query string when de-duping</label>
      <input type="checkbox" id="ignore-query-check">
    </div>
    <div class="settings-row">
      <label for="base-domain-check">Group subdomains together</label>
      <input type="checkbox" id="base-domain-check">
    </div>
    <div class="settings-row">
      <label for="live-mode-check">Live mode (auto dedupe)</label>
      <input type="checkbox" id="live-mode-check">
    </div>
    <div class="settings-row sub" id="live-sort-row">
      <label for="live-sort-check">Auto sort</label>
      <input type="checkbox" id="live-sort-check">
    </div>
    <div class="settings-row sub" id="live-group-row">
      <label for="live-group-check">Auto group</label>
      <input type="checkbox" id="live-group-check">
    </div>
  </div>

  <div class="divider"></div>

  <div class="section">
    <div class="section-title">Session Keepalive</div>
    <button class="btn primary" id="protect-btn" title="Pings this site in the background so its login session never expires">
      <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
      <span id="protect-label">Keep Me Logged In on This Site</span>
    </button>
    <button class="btn secondary" id="ping-now-btn" title="Ping all protected sites now">
      <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      Ping Now
    </button>
    <div class="site-list" id="site-list"></div>

    <button class="btn secondary" id="transfer-btn" title="Export or import protected sites">
      <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      Back up / restore
    </button>

    <div class="settings-row">
      <label for="interval-select">Default ping interval</label>
      <select id="interval-select"></select>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
